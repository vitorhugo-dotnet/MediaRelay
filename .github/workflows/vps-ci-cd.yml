name: MediaRelay CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Pull and deploy the latest published image to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: media-relay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate container
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MediaRelay.sln
      - name: Build Release
        run: dotnet build MediaRelay.sln --configuration Release --no-restore
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build container without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: media-relay:validation
          cache-from: type=gha,scope=media-relay
          cache-to: type=gha,mode=max,scope=media-relay

  test:
    name: Test solution
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build pinned MinIO Community test image
        run: docker build --file deploy/minio-community.Dockerfile --tag media-relay-minio:community-9e49d5e deploy
      - name: Run tests
        run: dotnet test MediaRelay.sln --configuration Release --logger "trx;LogFileName=MediaRelay.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-relay-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish immutable and latest images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vitorhugo-dotnet/media-relay:sha-${{ github.sha }}
            ghcr.io/vitorhugo-dotnet/media-relay:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=media-relay
          cache-to: type=gha,mode=max,scope=media-relay

  deploy:
    name: Pull and deploy latest image to production
    runs-on: ubuntu-latest
    needs: publish
    if: >-
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy && needs.publish.result == 'skipped')
      )
    environment:
      name: production
    concurrency:
      group: media-relay-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      INPUTS_DEPLOY: ${{ inputs.deploy }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4
      - name: Validate deployment secrets before SSH
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUTS_DEPLOY" != "true" ]]; then
              echo "Manual dispatch must set deploy=true to run this job." >&2
              exit 1
            fi
          fi
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing required production secret: %s\n' "$name" >&2
              exit 1
            fi
          done
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$VPS_PORT >= 1 && 10#$VPS_PORT <= 65535 )) || { echo "VPS_PORT must be an integer from 1 to 65535." >&2; exit 1; }
          [[ "$VPS_DEPLOY_PATH" == /* ]] || { echo "VPS_DEPLOY_PATH must be an absolute path." >&2; exit 1; }
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
      - name: Transfer only deployment files
        shell: bash
        run: |
          set -euo pipefail
          remote_path_b64="$(printf '%s' "$VPS_DEPLOY_PATH" | base64 -w 0)"
          remote="$(printf '%s' "$VPS_USER")@$(printf '%s' "$VPS_HOST")"
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=no "$remote" "path=\$(printf '%s' '$remote_path_b64' | base64 -d); mkdir -p \"\$path\""
          tar -C deploy -czf - docker-compose.prod.yml deploy.sh | ssh -p "$VPS_PORT" -o StrictHostKeyChecking=no "$remote" "path=\$(printf '%s' '$remote_path_b64' | base64 -d); tar -xzf - -C \"\$path\""
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=no "$remote" "set -e; path=\$(printf '%s' '$remote_path_b64' | base64 -d); chmod 700 \"\$path/deploy.sh\"; if [ -f \"\$path/.env\" ]; then sed -i 's|^COMPOSE_FILE=deploy/docker-compose.prod.yml\$|COMPOSE_FILE=docker-compose.prod.yml|' \"\$path/.env\"; fi; if [ -d \"\$path/deploy\" ]; then rm -f -- \"\$path/deploy/deploy.sh\" \"\$path/deploy/docker-compose.prod.yml\"; rmdir -- \"\$path/deploy\"; fi"
      - name: Pull latest image and start updated app with Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          remote_path_b64="$(printf '%s' "$VPS_DEPLOY_PATH" | base64 -w 0)"
          remote="$(printf '%s' "$VPS_USER")@$(printf '%s' "$VPS_HOST")"
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=no "$remote" "path=\$(printf '%s' '$remote_path_b64' | base64 -d); cd \"\$path\"; ./deploy.sh"
