services:
  app:
    image: ${IMAGE:?IMAGE must be a SHA-tagged MediaRelay image}
    container_name: mediarelay-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      DISCORD_ENABLED: ${DISCORD_ENABLED:-true}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-0}
      DISCORD_ALLOWED_GUILD_IDS: ${DISCORD_ALLOWED_GUILD_IDS:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Set MINIO_ENDPOINT to the existing MinIO S3 endpoint}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?Set MINIO_PUBLIC_ENDPOINT to the public media host}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-true}
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:?Set PUBLIC_MEDIA_BASE_URL}
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:?Set PUBLIC_APP_BASE_URL}
      UPLOAD_API_KEY: ${UPLOAD_API_KEY:?Set UPLOAD_API_KEY}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-536870912}
      UPLOAD_SESSION_TTL_MINUTES: ${UPLOAD_SESSION_TTL_MINUTES:-30}
      PRESIGNED_UPLOAD_TTL_MINUTES: ${PRESIGNED_UPLOAD_TTL_MINUTES:-15}
    networks:
      - infra_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  infra_network:
    external: true
    name: infra_network
